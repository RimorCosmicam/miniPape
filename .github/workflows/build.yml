name: Build miniPape

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS 27 app
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify macOS 27 SDK
        run: test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" = "27"
      - name: Build
        run: swift build --configuration release
      - name: Compile tests
        run: swift build --build-tests
      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/miniPape.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m 755 .build/release/miniPapeMac "$app/Contents/MacOS/miniPape"
          cp macOS/Packaging/Info.plist "$app/Contents/Info.plist"
          cp macOS/Packaging/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/miniPape-macOS.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: miniPape-macOS
          path: ${{ runner.temp }}/miniPape-macOS.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: miniPape-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
